[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[fuzz]
runs = 512

[rpc_endpoints]
bsc = "${BSC_MAINNET_RPC_URL}"

[etherscan]
bsc = { key = "${BSCSCAN_API_KEY}", chain = 56, url = "https://api.etherscan.io/v2/api?chainid=56" }

[fmt]
line_length = 110

[lint]
# uint64 timestamps/block numbers cannot overflow for billions of years; expiry uses
# second-level timestamps where validator drift is irrelevant.
exclude_lints = ["unsafe-typecast", "block-timestamp", "mixed-case-function", "mixed-case-variable"]
